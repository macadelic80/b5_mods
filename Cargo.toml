[workspace]
resolver = "2"
members = ["b5_mod_sdk", "debug_menu"]

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo" # drop DWARF, keep the wasm name section: a trap's backtrace in BrnGame.log names the function
panic = "abort"    # a panic is logged by the SDK's hook, then traps; the host switches the mod off
lto = true