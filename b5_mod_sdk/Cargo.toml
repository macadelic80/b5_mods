[package]
name = "b5_mod_sdk"
version = "0.1.0"
edition = "2021"
description = "Rust side of b5-decomp/src/pc/mods/api/brn_mod_api.h: write Burnout_PC.exe mods in Rust"

[features]
default = []
# An egui overlay drawn with the game's D3D9 device, plus a software cursor.
egui = ["dep:egui", "dep:windows"]

[dependencies]
egui = { version = "0.31", optional = true }
windows = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D9",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
