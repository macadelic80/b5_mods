[package]
name = "b5_mod_sdk"
version = "0.2.0"
edition = "2021"
description = "Rust side of b5-decomp/src/pc/mods/api/brn_mod_api.h: write sandboxed WebAssembly mods for Burnout_PC.exe"

[features]
default = []
# An egui overlay: egui's meshes go to the host as brn.ui.v1 draw lists.
egui = ["dep:egui"]

[dependencies]
egui = { version = "0.31", optional = true, default-features = false, features = ["default_fonts"] }